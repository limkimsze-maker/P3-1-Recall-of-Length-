name: Refresh Running 2P Gold
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('sports-fiesta-medal-hook-v4.js?v=20260811a','sports-fiesta-medal-hook-v4.js?v=20260811b')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refresh Running 2-player gold medal hook"
          git push
