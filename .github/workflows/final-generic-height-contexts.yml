name: Final Generic Height Contexts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace landmark height examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const structures=\[.*?\];', '''const structures=[
          {name:"double-decker bus",type:"bus",h:4},
          {name:"street lamp",type:"lamp",h:8},
          {name:"community sports hall",type:"school",h:12},
          {name:"park lookout tower",type:"tower",h:20},
          {name:"apartment block",type:"school",h:30},
          {name:"stadium floodlight mast",type:"tower",h:40}
          ];''', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Replace Singapore landmarks with generic height examples"
          git push
